[package]
name = "claude-usage-desktop"
version = "3.0.0"
description = "Painel de consumo Claude e Codex com backend integrado"
authors = ["Eduardo Campos"]
license = "MIT"
repository = "https://github.com/eueduardocampos/claude-usage"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.7"
