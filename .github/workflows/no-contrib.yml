name: Recusar PRs externos

# Projeto da Astronauta Martech: PRs de quem nao e membro da organizacao (ou
# colaborador do repositorio) sao fechados automaticamente.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-external:
    runs-on: ubuntu-latest
    if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: "Obrigado pelo interesse! Este projeto e mantido pela Astronauta " +
                    "Martech e nao aceita contribuicoes externas, entao este PR sera fechado " +
                    "automaticamente. Fique a vontade para dar fork e adaptar " +
                    "para o seu uso. 🙂"
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed"
            });
