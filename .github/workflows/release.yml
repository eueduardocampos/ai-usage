name: Instaladores completos
on:
  push:
    tags: ['v*']
    branches: ['publish/ai-usage']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
      - name: Dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Compilar interface e validar coletores
        run: |
          npm --prefix web ci
          npm --prefix web run build
          python test/test_codex_usage.py
          python test/test_codex_pricing.py
          python test/test_rate_limit.py
          node streamdeck/test/unified.js
          node streamdeck/test/fake_sd.js
      - name: Empacotar Python e painel
        run: |
          python -m pip install pyinstaller==6.22.2 certifi
          python desktop/packaging/build.py
          python desktop/packaging/smoke.py
      - name: Gerar instaladores
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Testar motor dentro do aplicativo instalado
        run: python desktop/packaging/check_bundle.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
  streamdeck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @elgato/cli validate streamdeck/digital.astronauta.claudeusage.sdPlugin
      - run: |
          mkdir -p dist-release
          cd streamdeck
          zip -r ../dist-release/digital.astronauta.claudeusage.streamDeckPlugin digital.astronauta.claudeusage.sdPlugin
          cp *.streamDeckProfile ../dist-release/
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck
          path: dist-release/*
  publish:
    needs: [desktop, streamdeck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publicar somente depois de todos os builds passarem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --repo "$REPO" --title "$RELEASE_TAG — Consumo de IA" --notes-file desktop/RELEASE.md --verify-tag
